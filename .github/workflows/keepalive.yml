name: Keepalive

# GitHub schakelt geplande taken uit na 60 dagen zonder repo-activiteit.
# Deze taak maakt periodiek een klein commitje, zodat de push-wekker blijft draaien.

on:
  schedule:
    - cron: "17 4 1,15 * *"   # op de 1e en 15e van elke maand
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo actief houden
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-active
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-active
          git diff --staged --quiet && echo "niets veranderd" && exit 0
          git commit -m "keepalive: repo actief houden zodat de push-wekker blijft draaien"
          git push
